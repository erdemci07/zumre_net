<!DOCTYPE html>
<html>
<head>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #061833;
    }

    #startup-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #103d66 0%, #061833 62%);
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
      z-index: 9999;
    }
  </style>
<script>
  (function () {
    const host = window.location.hostname;

    if (
      host === 'bilimkalesi-zumre.web.app' ||
      host === 'bilimkalesi-zumre.firebaseapp.com'
    ) {
      const newUrl =
        'https://bilimkalesi.zumrenet.com' +
        window.location.pathname +
        window.location.search +
        window.location.hash;

      window.location.replace(newUrl);
    }
  })();
</script>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bilim Kalesi Eğitim Kurumları için zümre ve etüt yönetim sistemi.">
  <meta property="og:title" content="ZümreNet">
  <meta property="og:description" content="Bilim Kalesi Eğitim Kurumları için zümre ve etüt yönetim sistemi.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="ZümreNet">
  <meta name="twitter:description" content="Bilim Kalesi Eğitim Kurumları için zümre ve etüt yönetim sistemi.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ZümreNet">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ZümreNet</title>
  <link rel="manifest" href="manifest.json">

</head>
<body>
  <div id="startup-splash">ZümreNet</div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      onEntrypointLoaded: async function(engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();

        const splash = document.getElementById('startup-splash');
        if (splash) {
          splash.remove();
        }
      }
    });
  </script>
</body>
</html>
