name: Deploy Ayet Rehberi Notifications
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ayet_notifications/**'
      - 'firebase.ayet-notifications.json'
      - '.github/workflows/deploy-ayet-notifications.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: ayet-notifications-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify isolated push backend
        run: |
          node --check ayet_notifications/index.mjs
          node --check ayet_notifications/rules.mjs
          node --test ayet_notifications/rules.test.mjs
  deploy:
    needs: verify
    # Cloud secrets, runtime identity and deployment permissions must be configured first.
    if: vars.ENABLE_AYET_NOTIFICATIONS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate with existing ZümreNet Workload Identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/542741706921/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-hosting@zumrenet-657e1.iam.gserviceaccount.com
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Ayet-only dependencies
        working-directory: ayet_notifications
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Deploy only Ayet Rehberi Cloud Functions
        run: npx --yes firebase-tools@15.32.0 deploy --config firebase.ayet-notifications.json --only functions:ayet-notifications --project zumrenet-657e1 --non-interactive
