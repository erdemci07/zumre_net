name: Deploy Paralel Okuma Notifications
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paralel_notifications/**'
      - 'firebase.notifications.json'
      - '.github/workflows/deploy-paralel-notifications.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: paralel-notifications-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/542741706921/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-hosting@zumrenet-657e1.iam.gserviceaccount.com
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify isolated notification code
        run: node --check paralel_notifications/index.js
      - name: Deploy only the new notification codebase
        run: npx --yes firebase-tools@15.32.0 deploy --config firebase.notifications.json --only functions:paralel-notifications --project zumrenet-657e1 --non-interactive
